<style>
:root{--ink:#1d2a26;--muted:#5d6b66;--line:#d5dbd5;--panel:#ffffffee;--sch:#1f6f5c;--aca:#c2410c;--kyo:#6d28d9;--bnd:#2f5d50;
--font:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif}
html,body{height:100%;margin:0}
body{font:14px var(--font);color:var(--ink);background:#eef1ec}
#map{position:fixed;inset:0}
.panel{position:fixed;z-index:10;top:calc(12px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));width:300px;max-height:calc(100% - 24px);overflow:auto;background:var(--panel);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 24px #0002}
.ph{padding:12px 14px 8px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.ph h1{margin:0;font-size:16px;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}.ph h1 .rf{font-size:12px;color:var(--muted);font-weight:400;vertical-align:1px}.ph h1:active{opacity:.6}
#rtoast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:60;background:#12263c;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;box-shadow:0 8px 24px #0006}
.ph p{margin:3px 0 0;color:var(--muted);font-size:12px;white-space:nowrap}
.order{font-size:11px;font-weight:600;color:var(--muted);padding:8px 14px 2px;border-top:1px solid var(--line)}
.layers{display:flex;flex-direction:column;padding:2px 6px 6px}
.ly{display:grid;grid-template-columns:16px 12px 1fr auto;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;cursor:pointer;font-size:13px}
.ly:hover{background:#0000000a}
.ly input{margin:0;width:15px;height:15px;accent-color:var(--bnd)}
.ly b{font-weight:600}.ly small{display:none}
.ly .ct{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;text-align:right}
.sw{width:11px!important;height:11px!important}
.ly .sw.sch{transform:none;display:block;gap:0}
.sw{width:13px;height:13px;display:block}
.sw.sch{background:var(--sch);border-radius:3px}.sw.aca{background:var(--aca);border-radius:50%}
.sw.kyo{background:var(--kyo);transform:rotate(45deg) scale(.8);border-radius:2px}.sw.base{border:3px dashed #e6007e;border-radius:3px;box-shadow:0 0 0 1px #fff}
.basesel{display:flex;gap:4px}
.lvsel{display:flex;justify-content:flex-end;gap:5px;padding:0 8px 6px}
.lvsel button{all:unset;cursor:pointer;font-size:11.5px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--muted)}
.lvsel button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.basesel button{font:inherit;font-size:11px;padding:2px 7px;border:1px solid var(--line);border-radius:999px;background:#fff;cursor:pointer;color:var(--ink)}
.basesel button[aria-pressed="true"]{border-color:var(--bnd);color:var(--bnd);font-weight:700}
.search{padding:8px 14px 10px;border-top:1px solid var(--line)}
.qrow{display:flex;gap:6px;align-items:center}.qrow button,.rsgo{all:unset;cursor:pointer;flex:none;height:26px;padding:0 11px;border-radius:13px;background:#12263c;color:#fff;font-size:12px;font-weight:600;letter-spacing:.02em;display:flex;align-items:center;box-shadow:0 1px 3px #12263c40}.qrow button:active,.rsgo:active{background:#1f3a5a}
.search input{box-sizing:border-box;width:100%;min-width:0;flex:1;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:7px}
.qact{margin-top:6px}.qact button{all:unset;cursor:pointer;box-sizing:border-box;width:100%;text-align:center;padding:7px 10px;border-radius:7px;background:#12263c;color:#fff;font-size:13px;font-weight:700}.qact button.on{background:#fff;color:#12263c;border:1px solid #12263c}
#fqchip{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:40;background:#12263c;color:#fff;border-radius:16px;padding:7px 8px 7px 14px;font-size:13px;box-shadow:0 4px 14px #0005;max-width:calc(100vw - 32px)}#fqchip .r1{display:flex;gap:8px;align-items:center;justify-content:space-between}#fqchip .r2{margin-top:6px;display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-size:12px;color:#ffffffcc}#fqchip .r2 button{background:#f2aa4c;color:#12263c;padding:2px 9px}
.sumb{background:#12263cee;color:#fff;border-radius:9px;padding:2px 7px;font-size:11px;line-height:1.3;white-space:nowrap;text-align:center;cursor:pointer;box-shadow:0 1px 5px #0005;border:1.5px solid #fff}.sumb b{font-size:12px}.sumb span{color:#ffcf9e;font-weight:700}
.rm{position:relative;cursor:pointer}.rm i{display:block;width:11px;height:11px;border-radius:50%;background:#c2410c;border:2px solid #fff;box-shadow:0 0 0 2px #12263c}.rm.k i{background:#6d28d9}.rm.s i{background:#1f6f5c;border-radius:2px}.rm em{position:absolute;left:16px;top:-3px;white-space:nowrap;font-style:normal;font-size:11px;font-weight:700;background:#fff;border:1px solid #12263c;border-radius:4px;padding:0 4px;color:#12263c}.rm.nolabel em{display:none}.rmh{font-size:11px;color:var(--muted);padding:6px 8px 2px;border-top:1px solid var(--line);margin-top:4px}#fqchip[hidden]{display:none}#fqchip b{color:#f2aa4c;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#fqchip button{all:unset;cursor:pointer;background:#ffffff26;border-radius:14px;padding:2px 10px;font-weight:700;flex:none}
#results{display:flex;flex-direction:column;max-height:170px;overflow:auto;margin-top:4px}
#results button{all:unset;cursor:pointer;padding:5px 8px;border-radius:6px;font-size:13px}
#results button:hover{background:#0000000d}#results small{color:var(--muted)}
.note{padding:8px 14px 10px;border-top:1px solid var(--line);color:#8a958f;font-size:9.5px;line-height:1.45}
.toggle{all:unset;cursor:pointer;color:var(--ink);font-size:13px;font-weight:600;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;flex:none}
.panel.min .order,.panel.min .layers,.panel.min .search,.panel.min .note{display:none}
@media (max-width:640px){
 .panel{left:calc(8px + env(safe-area-inset-left,0px));top:calc(8px + env(safe-area-inset-top,0px));width:min(322px,calc(100vw - 60px));max-height:calc(100% - 16px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
 #fqchip{top:auto;bottom:calc(14px + env(safe-area-inset-bottom,0px))}
 .panel{overflow-x:hidden}.ph{padding:10px 10px 8px;gap:6px}.ph h1{font-size:15px}.ph p{font-size:11px}.inst{font-size:12px;padding:5px 8px;margin-right:4px}.hidep{margin-right:4px}.toggle{padding:5px 8px}
}
.cats{padding:8px 14px 10px;border-top:1px solid var(--line)}
.cats .t{font-size:11px;font-weight:600;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between}
.cats .t button{all:unset;cursor:pointer;color:var(--muted);font-size:11px;font-weight:600;text-decoration:underline}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips button{all:unset;cursor:pointer;font-size:11.5px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--muted)}
.chips button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.chips button small{opacity:.75;margin-left:3px}
.panel.min .cats{display:none}
.pop .gt{width:100%;border-collapse:collapse;margin-top:8px;font-size:12.5px;font-variant-numeric:tabular-nums}.pop .gt th,.pop .gt td{padding:2px 6px;border-bottom:1px solid var(--line);text-align:right}.pop .gt th:first-child,.pop .gt td:first-child{text-align:left}.pop .gt th{color:var(--muted);font-weight:600}
.pop .src{margin:6px 0 0;font-size:11px;color:var(--muted)}
/* map overlays */
.grp{transform:translate(-50%,-50%);min-width:22px;height:22px;padding:0 5px;box-sizing:border-box;border-radius:11px;border:2px solid #fff;box-shadow:0 1px 4px #0006;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11.5px;font-weight:800;cursor:pointer;font-variant-numeric:tabular-nums}
.grp.a{background:var(--aca)}.grp.k{background:var(--kyo)}.grp.m{background:linear-gradient(135deg,var(--aca) 50%,var(--kyo) 50%)}
.pop .gl{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.pop .gl li{border-bottom:1px solid var(--line)}
.pop .gl button{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:6px;padding:5px 2px;cursor:pointer;font-size:12.5px}
.pop .gl button:hover{background:#0000000a}
.pop .gl small{margin-left:auto;color:var(--muted);font-size:11px;white-space:nowrap;padding-left:6px}
.pop .gl i{flex:none;width:8px;height:8px;border-radius:50%}.pop .gl i.a{background:var(--aca)}.pop .gl i.k{background:var(--kyo);border-radius:1px;transform:rotate(45deg)}
.pop .gl button.on{font-weight:700;color:var(--bnd)}
.pop .gd{padding:2px 4px 8px 14px;font-size:12px}.pop .gd dl{margin:0}
.pop .back{all:unset;cursor:pointer;font-size:12px;color:var(--bnd);font-weight:700;display:block;margin:0 0 4px}
.ac{position:relative;width:28px;height:28px;transform:translate(-50%,-50%);cursor:pointer;-webkit-tap-highlight-color:transparent}
.dot{position:absolute;left:8px;top:8px;width:12px;height:12px;border-radius:50%;background:var(--aca);border:1.5px solid #fff;box-shadow:0 1px 3px #0005;box-sizing:border-box}
.ac.kyo .dot{left:9px;top:9px;width:10px;height:10px;border-radius:2px;background:var(--kyo);transform:rotate(45deg)}
.ac em{position:absolute;left:24px;top:50%;transform:translateY(-50%);font-style:normal;white-space:nowrap;background:#fffffff0;border:1px solid var(--aca);border-radius:4px;padding:0 4px;font-size:11px;font-weight:600;color:var(--ink);box-shadow:0 1px 2px #0002;pointer-events:none}
.ac.kyo em{border-color:var(--kyo)}
.ac.nolabel em{display:none}
.ac em.mv{transform:none}
.sch{display:flex;align-items:center;gap:4px;transform:translate(-7px,-50%);cursor:pointer;white-space:nowrap}
.sch i{width:13px;height:13px;border-radius:3px;background:var(--sch);border:2px solid #fff;box-shadow:0 1px 3px #0005;flex:none}
.sch span{background:#fff;border:1px solid var(--sch);border-radius:4px;padding:1px 5px;font-size:11.5px;font-weight:600;color:var(--ink);box-shadow:0 1px 3px #0002}
.sch span small{font-size:9.5px;font-weight:500;color:var(--muted)}
.sch.nolabel span{display:none}
.pop{position:relative;bottom:14px;white-space:normal;overflow-x:hidden;max-height:min(440px,62vh);overflow:auto;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 20px #0003;padding:10px 12px;width:min(300px,calc(100vw - 32px));box-sizing:border-box;font-size:13px;line-height:1.5}
.pop h3{margin:0 0 2px;font-size:15px}
.pop .lks{display:flex;flex-wrap:wrap;gap:4px}.pop .lkb{display:inline-block;font-size:12px;font-weight:700;color:#12263c;border:1px solid #c9d3de;border-radius:999px;padding:1px 8px;text-decoration:none;background:#f3f6f9}.pop .rbx summary{cursor:pointer;font-size:12px;color:var(--muted)}.pop .rbx ul{margin:4px 0;padding-left:16px;font-size:12px}.pop .rbx small{font-size:10.5px;color:var(--muted)}
.pop .tag{display:inline-block;font-size:11px;font-weight:700;color:#fff;border-radius:999px;padding:1px 7px;margin-bottom:4px}
.pop dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;margin:4px 0 0}.pop dt{color:var(--muted);white-space:nowrap}.pop dd{margin:0;min-width:0;overflow-wrap:anywhere;word-break:break-word}.pop dd.ad{font-size:12px;line-height:1.4;color:#444}.pop h3{overflow-wrap:anywhere}
.pop .x{position:absolute;top:4px;right:8px;cursor:pointer;color:var(--muted);font-size:16px;background:none;border:0}
#err{position:fixed;inset:0;display:none;place-items:center;z-index:20;background:#eef1ec;padding:24px;text-align:center;color:var(--muted)}
.mode{display:flex;gap:4px;margin:10px 12px 0;padding:3px;background:#eef1ec;border-radius:9px}
.mode button{flex:1;font:inherit;font-size:13px;font-weight:700;padding:7px 0;border:0;border-radius:7px;background:transparent;color:var(--muted);cursor:pointer}
.mode button[aria-pressed=true]{background:#fff;color:var(--bnd);box-shadow:0 1px 3px #0002}
.current{display:flex;align-items:center;gap:7px;margin:8px 12px 0;padding:8px 9px;background:#edf3ee;border-left:3px solid var(--bnd);border-radius:5px;min-width:0}
.current small{flex:none;font-size:11px;color:var(--muted)}.current strong{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.rp{padding:8px 12px 10px}
.rsw{display:flex;gap:6px;align-items:center}.rsw .rs{flex:1;min-width:0}
.rs{position:relative}.rs input{box-sizing:border-box;width:100%;height:36px;font:inherit;font-size:13px;padding:7px 34px 7px 10px;border:1px solid #a9bdb1;border-radius:8px}
.rs button{position:absolute;right:0;top:0;width:36px;height:36px;border:0;background:none;font-size:17px;color:var(--muted);cursor:pointer}
.tabs{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:4px;margin:7px 0}.tabs button{font:inherit;font-size:12.5px;font-weight:600;padding:6px 2px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);cursor:pointer;white-space:nowrap}
.tabs button[aria-pressed=true]{background:var(--bnd);border-color:var(--bnd);color:#fff}
.hint{margin:0 0 6px;font-size:11px;color:var(--muted)}
.list{position:relative;max-height:240px;overflow-y:auto;overscroll-behavior:contain;padding-right:2px;scrollbar-width:thin}
.list .row{display:block;width:100%;box-sizing:border-box;text-align:left;font:inherit;padding:6px 10px;margin-bottom:4px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);cursor:pointer}
.list .row:hover{background:#eef4ef;border-color:#9eb5a8}
.list .row strong{display:block;font-size:13px}.list .row small{display:block;font-size:11px;color:var(--muted);margin-top:1px}
.list .row[aria-pressed=true]{background:var(--bnd);border-color:var(--bnd);color:#fff}.list .row[aria-pressed=true] small{color:#ffffffcc}
.list details{border-bottom:1px solid var(--line);margin-bottom:4px}.list details[open]{background:#f7f9f6;border-radius:8px}
.list summary{list-style:none;cursor:pointer;position:relative;padding:7px 30px 7px 9px}.list summary::-webkit-details-marker{display:none}
.list summary:after{content:'';position:absolute;right:13px;top:14px;width:7px;height:7px;border-right:2px solid #69776e;border-bottom:2px solid #69776e;transform:rotate(45deg)}
.list details[open]>summary:after{top:18px;transform:rotate(-135deg)}
.list summary strong{display:block;font-size:13px}.list summary small{display:block;font-size:11px;color:var(--muted);margin-top:1px}
.list details .in{padding:0 6px 6px}
.list .sp{border-bottom:1px solid var(--line);padding-bottom:4px;margin-bottom:6px}
.list .gh{font-size:11px;font-weight:700;color:var(--muted);margin:6px 2px 4px}
.list .empty{padding:16px 8px;text-align:center;color:var(--muted);font-size:12px;line-height:1.6}
.zi{padding:2px 12px 10px;border-top:1px solid var(--line)}
.zi h2{font-size:13px;margin:10px 0 6px;display:flex;justify-content:space-between;align-items:baseline}.zi h2 small{font-weight:500;color:var(--muted);font-size:11px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.tiles span{background:#f7f8f5;border-radius:6px;padding:5px 2px;text-align:center;font-size:10.5px;color:var(--muted)}.tiles b{display:block;font-size:14px;color:var(--ink);font-variant-numeric:tabular-nums}
.cbar{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:2px 0 4px}.cleg{display:flex;flex-wrap:wrap;gap:2px 9px;font-size:11px;color:var(--muted)}.cleg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:3px}
.zt{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}.zt td,.zt th{padding:2px 4px;border-bottom:1px solid var(--line);text-align:right}.zt td:first-child,.zt th:first-child{text-align:left}.zt th{color:var(--muted);font-weight:600}
.rsel{display:flex;gap:3px}.rsel button{font:inherit;font-size:11px;padding:1px 7px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--muted);cursor:pointer}.rsel button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.yrs{display:flex;align-items:flex-end;gap:2px;height:54px;margin-top:4px}.yrs div{flex:1;background:#c2410c99;border-radius:2px 2px 0 0;min-height:1px;position:relative}.yrs div:hover{background:var(--aca)}
.yax{display:flex;justify-content:space-between;font-size:10px;color:var(--muted)}
.zi ol{margin:0;padding-left:18px;font-size:12px}.zi ol li{margin:1px 0}.zi ol small{color:var(--muted)}
.zi .src{font-size:10.5px;color:var(--muted);margin:6px 0 0;line-height:1.5}
.ac.dim,.grp.dim{opacity:.35}
.panel.min .rp,.panel.min .zi,.panel.min .mode{display:none}
.inst{all:unset;cursor:pointer;font-size:13px;font-weight:700;padding:6px 10px;border-radius:8px;background:#12263c;color:#fff;flex:none;margin-right:6px}
.inst[hidden]{display:none}
.ihelp{position:fixed;left:12px;right:12px;bottom:16px;z-index:50;background:#12263c;color:#fff;border-radius:14px;padding:14px 16px;font-size:14px;line-height:1.6;box-shadow:0 8px 24px #0006}
.ihelp b{color:#f2aa4c}.ihelp button{all:unset;cursor:pointer;float:right;font-weight:700;padding:0 4px}
.panel{transition:transform .25s ease,opacity .25s;touch-action:pan-y}.panel.drag{transition:none}.panel.away{transform:translateX(calc(-100% - 30px));opacity:0;pointer-events:none}
#ptab{all:unset;cursor:pointer;position:fixed;z-index:12;left:0;top:calc(32% - 32px);width:26px;height:64px;border-radius:0 12px 12px 0;background:#12263c;color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:2px 2px 10px #0004;touch-action:none}
#ptab[hidden]{display:none}.hidep{all:unset;cursor:pointer;font-size:15px;font-weight:700;padding:5px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;margin-right:6px;flex:none;color:var(--ink)}
#mebtn{all:unset;cursor:pointer;position:fixed;z-index:20;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:44px;height:44px;border-radius:50%;background:#fff;box-shadow:0 2px 10px #0004;display:flex;align-items:center;justify-content:center;color:#475569}
#mebtn svg{width:24px;height:24px}#mebtn.on{color:#2563eb}#mebtn.fol{background:#2563eb;color:#fff}
.medot{width:16px;height:16px;border-radius:50%;background:#2563eb;border:3px solid #fff;box-shadow:0 0 0 2px #2563eb55,0 2px 6px #0006;animation:mep 2s infinite}
@keyframes mep{0%{box-shadow:0 0 0 0 #2563eb88,0 2px 6px #0006}70%{box-shadow:0 0 0 14px #2563eb00,0 2px 6px #0006}100%{box-shadow:0 0 0 0 #2563eb00,0 2px 6px #0006}}

</head>
<body>
<button id="mebtn" title="내 위치 보기" aria-label="내 위치"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg></button>
<div id="map"></div>

  if(best){const r=idx.regs[best[2]];if(r&&CUR===sr0&&r!==CUR&&(R2A[r]||GRPS[r]))pick(r)}},()=>{},{enableHighAccuracy:false,timeout:10000,maximumAge:600000})}
}
})();
</script>
<script>
if('serviceWorker' in navigator){
 // 새 버전이 배포되면 앱을 다시 열지 않아도 자동으로 새로고침
 const hadCtrl=!!navigator.serviceWorker.controller;let reloaded=false;
 navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadCtrl&&!reloaded){reloaded=true;location.reload()}});
 addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{
  const chk=()=>reg.update().catch(()=>{});setInterval(chk,10*60*1000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')chk()})}).catch(()=>{}));
}
(()=>{const b=document.getElementById('inst');let ev=null;
 const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
 if(standalone)return;
 const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
 function help(html){let h=document.querySelector('.ihelp');if(h)h.remove();h=document.createElement('div');h.className='ihelp';h.innerHTML='<button aria-label="닫기">✕</button>'+html;h.firstChild.onclick=()=>h.remove();document.body.appendChild(h)}
 addEventListener('beforeinstallprompt',e=>{e.preventDefault();ev=e;b.hidden=false});
 addEventListener('appinstalled',()=>{b.hidden=true;ev=null});
 if(ios)b.hidden=false;
 b.onclick=async()=>{
  if(ev){ev.prompt();const r=await ev.userChoice.catch(()=>({}));if(r.outcome==='accepted')b.hidden=true;ev=null;return}
  if(ios){help('<b>아이폰 설치</b><br>사파리 아래쪽 <b>공유 버튼(□↑)</b> → <b>홈 화면에 추가</b>를 누르세요.<br><small>사파리에서만 설치할 수 있습니다.</small><div id="pairc"></div>');
   if(window.ACC&&ACC.on()){const pc=document.getElementById('pairc');pc.innerHTML='<br><small>연결 코드 받는 중…</small>';
    ACC.pairCode().then(c=>{pc.innerHTML='<br>설치한 앱을 처음 열면 아래 <b>연결 코드</b>를 넣어 주세요 (15분 유효).<div style="font-size:22px;font-weight:800;letter-spacing:2px;margin:6px 0">'+c+'</div>'}).catch(()=>{pc.innerHTML='<br><small>연결 코드를 받지 못했습니다. 다시 눌러 주세요.</small>'})}}
  else help('<b>앱 설치</b><br>브라우저 메뉴(⋮ 또는 ≡)에서 <b>앱 설치</b> 또는 <b>홈 화면에 추가 → 앱</b>을 누르세요.');
 };
})();
</script>
